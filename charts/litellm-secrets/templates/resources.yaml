apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  provider: oci
  secretObjects:
    - data:
        - key: database-password
          objectName: database-password
        - key: master-key
          objectName: master-key
        - key: salt-key
          objectName: salt-key
        - key: oci-api-key.pem
          objectName: oci-api-key.pem
        - key: redis-password
          objectName: redis-password
      secretName: {{ .Values.name }}-runtime
      type: Opaque
  parameters:
    authType: workload
    vaultId: {{ .Values.vaultId | quote }}
    secrets: |
      - name: {{ .Values.databasePasswordSecretName }}
        fileName: database-password
      - name: {{ .Values.masterKeySecretName }}
        fileName: master-key
      - name: {{ .Values.saltKeySecretName }}
        fileName: salt-key
      - name: {{ .Values.ociPrivateKeySecretName }}
        fileName: oci-api-key.pem
      - name: {{ .Values.redisPasswordSecretName }}
        fileName: redis-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-secret-sync
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-secret-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-secret-sync
    spec:
      containers:
        - name: secret-sync
          image: {{ .Values.image | quote }}
          command: ["/bin/sh", "-ec", "while true; do sleep 3600; done"]
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -s /mnt/secrets/master-key"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /mnt/secrets
              name: secrets
              readOnly: true
      volumes:
        - csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.name }}
          name: secrets
